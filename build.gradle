plugins {
    id "net.fabricmc.fabric-loom" version '1.17.16'
    id 'dev.gxlg.versiont-toolchain' version '1.3.8'
}

group = 'com.laviesss.xaerodisabledradarfixer'
version = '3.0.0 Universal+1.21'

java {
    withSourcesJar()
    targetCompatibility = JavaVersion.VERSION_21
}

versiont {
    mapping = file("src/main/resources/versiont.mapping")
}

repositories {
    mavenCentral()
    maven { url = "https://maven.fabricmc.net/" }
    //maven { url = "https://maven.isxander.dev/releases" }
}

dependencies {
    minecraft "com.mojang:minecraft:26.2"
    implementation "net.fabricmc:fabric-loader:0.19.3"
    implementation "net.fabricmc.fabric-api:fabric-api:0.155.2+26.2"

    //implementation "dev.isxander:yet-another-config-lib:3.9.6+26.2-fabric"
}

processResources {
    inputs.property("version", project.version)
    filesMatching("fabric.mod.json") {
        expand(version: project.version)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release.set(21)
}