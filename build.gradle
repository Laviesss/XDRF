buildscript {
    repositories {
        maven { url 'https://maven.muon.rip/releases' }
    }
    dependencies {
        classpath 'dev.mixinmcp:mixinmcp-gradle:1.3.0'
    }
}

plugins {
    id 'fabric-loom' version '1.17.16'
    id 'maven-publish'
    id 'dev.gxlg.versiont-toolchain' version '1.3.6'
}

apply plugin: 'dev.mixinmcp.decompile'

group = 'com.laviesss.xaerodisabledradarfixer'
version = '3.0.0 Universal+1.21'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
}

versiont {
    mapping = file("src/main/resources/versiont.mapping")
}

loom {
//    enableTransitiveAccessWideners = false
}

repositories {
    mavenCentral()
    maven { url = "https://maven.fabricmc.net/" }
    maven { url = "https://maven.terraformersmc.com/" }
    maven { url = "https://maven.isxander.dev/releases" }
    maven { url = "https://gxlg.github.io/maven-repo/" }
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:1.21"
    mappings "net.fabricmc:yarn:1.21+build.1:v2"
    modImplementation "net.fabricmc:fabric-loader:0.16.14"
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.100.1+1.21"
    modImplementation "dev.isxander:yet-another-config-lib:3.6.2+1.21-fabric"
    modImplementation "com.terraformersmc:modmenu:11.0.0"
    modImplementation "dev.gxlg:versiont-library:1.2.4"  // NOT included (no jar-in-jar) — users install Version't separately
}

configurations.all {
    resolutionStrategy {
        force 'net.fabricmc.fabric-api:fabric-api:0.100.1+1.21'
        force 'net.fabricmc:fabric-loader:0.16.14'
    }
}

processResources {
    inputs.property("version", project.version)
    filesMatching("fabric.mod.json") {
        expand(version: project.version)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release.set(21)
}

tasks.named("sourcesJar") {
    dependsOn(tasks.named("versiontLayer"))
}


// Fix Version't generator inner class cast bug:
// Generator emits JVM bytecode $ notation (Outer$Inner) in fully-qualified casts,
// but Java source requires dot notation (Outer.Inner).
// This post-processes generated .java files to fix only fully-qualified cast expressions.
tasks.named("versiontLayer") {
    doLast {
        def genDir = layout.buildDirectory.dir("generated/sources/versiont/java").get().asFile
        if (genDir.exists()) {
            genDir.eachDirRecurse { dir ->
                dir.listFiles()?.findAll { it.name.endsWith('.java') }?.each { file ->
                    def content = file.text
                    // Fix fully-qualified casts with inner classes: (pkg.Outer$Inner) → (pkg.Outer.Inner)
                    def fixed = content.replaceAll(
                        /\(([a-z][\w]*(?:\.[\w]+)+)\$([\w]+)\)/,
                        '($1.$2)'
                    )
                    if (fixed != content) {
                        file.text = fixed
                        println "Fixed inner class casts in: ${file.name}"
                    }
                }
            }
        }
    }
}

// Ensure remapJar runs as part of build so the output jar has intermediary mappings
tasks.named("build") {
    dependsOn(tasks.named("remapJar"))
}