plugins {
    id "net.fabricmc.fabric-loom" version '1.17.16'
    id 'dev.gxlg.versiont-toolchain' version '1.3.9'
}

version = '3.1.0 Universal+1.21-26.2'
group = 'com.laviesss'

base {
    archivesName = "XaeroDisabledRadarFixer"
}

repositories { }

dependencies {
    minecraft "com.mojang:minecraft:26.2"
    implementation "net.fabricmc:fabric-loader:0.19.3"
    implementation "net.fabricmc.fabric-api:fabric-api:0.155.2+26.2"
}

processResources {
    inputs.property("version", project.version)
    filesMatching("fabric.mod.json") {
        expand(version: inputs.properties.version)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release.set(21)
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    inputs.property("archivesName", project.base.archivesName)
    from("LICENSE") {
        rename { "${it}_${inputs.properties.archivesName}" }
    }
}

versiont {
    mapping = file("src/main/resources/versiont.mapping")
}
